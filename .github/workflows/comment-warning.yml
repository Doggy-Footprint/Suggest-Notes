name: Comment warning

on:
  pull_request:

permissions:
  contents: read

jobs:
  warn-on-new-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn about added comments and docstrings
        run: python3 .githooks/warn_new_comments.py "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
